<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Dream Wedding Planner</title>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #D0DDD0;
            font-family: "Poppins", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            font-family: "Great Vibes", cursive;
            font-size: 32px;
            color: #AAB99A;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        button {
            background-color: #AAB99A;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 10px;
            transition: 0.3s;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background-color: #8f9f8a;
        }

        .link {
            color: #AAB99A;
            text-decoration: none;
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }

        .link:hover {
            text-decoration: underline;
        }

        .signup-text {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }

        .signup-text a {
            color: #AAB99A;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // هنا يمكنك تغيير البيانات المسموح بها حسب رغبتك
            // مثال: إيميل واحد أو أكثر مع كلمات سر مختلفة

            const validUsers = [
                { email: "admin@example.com", password: "123456" },
                { email: "user@wedding.com", password: "wedding2025" },
                { email: "test@test.com", password: "test123" }
                // أضف المزيد إذا أردت
            ];

            // التحقق من وجود المستخدم
            const user = validUsers.find(u => u.email === email && u.password === password);

            if (user) {
                alert("تم تسجيل الدخول بنجاح! مرحباً بك 🎉");
                window.location.href = "main.html"; // الانتقال إلى الصفحة الرئيسية
            } else {
                alert("الإيميل أو كلمة المرور غير صحيحة. حاول مرة أخرى.");
            }
        });
    </script>

    <div class="signup-text">
        Don’t have an account? <a href="signup.html">Sign up</a>
    </div>

    <a href="main.html" class="link">← Back to Home</a>
</div>
</body>
</html>
